name: CD - Build and Push Docker Images

on:
  push:
    branches: [ main ]

# ① env：全局环境变量
env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # ② 构建并推送 API 镜像
  # ============================================================
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ③ 登录 Docker Hub（使用 secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ④ 构建并推送镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagementAPI
          file: ./TaskManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/taskapi:latest
            ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}

  # ============================================================
  # 构建并推送 Consumer 镜像
  # ============================================================
  build-consumer:
    name: Build & Push Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./RabbitMQConsumer
          file: ./RabbitMQConsumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:latest
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}

  # # ============================================================
  # # 构建并推送 Frontend 镜像
  # # ============================================================
  # build-frontend:
  #   name: Build & Push Frontend
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Login to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKER_USERNAME }}
  #         password: ${{ secrets.DOCKER_PASSWORD }}

  #     - name: Build and push Frontend image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: ./frontend
  #         file: ./frontend/Dockerfile
  #         push: true
  #         tags: |
  #           ${{ env.IMAGE_PREFIX }}/frontend:latest
  #           ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ============================================================
  # ⑤ 部署任务（needs：等上面三个全部成功才执行）
  # ============================================================
  deploy:
    name: Deploy to Server
    needs: [ build-api, build-consumer ]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 生成 .env 文件（注入到 Runner 工作目录）
      - name: Create .env file
        shell: powershell
        run: |
          @"
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=${{ secrets.ASPNETCORE_ENVIRONMENT }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Pull latest images
        shell: powershell
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/taskapi:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/rabbitmqconsumer:latest

      - name: Deploy with docker-compose
        shell: powershell
        run: docker compose up -d
