name: CD - Build and Push Docker Images

on:
  push:
    branches: [ main ]

# ① env：全局环境变量
env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # ② 构建并推送 API 镜像
  # ============================================================
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ③ 登录 Docker Hub（使用 secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ④ 构建并推送镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagementAPI
          file: ./TaskManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/taskapi:latest
            ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}

  # ============================================================
  # 构建并推送 Consumer 镜像
  # ============================================================
  build-consumer:
    name: Build & Push Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./RabbitMQConsumer
          file: ./RabbitMQConsumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:latest
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}

  # ============================================================
  # 构建并推送 Frontend 镜像
  # ============================================================
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ============================================================
  # ⑤ 部署任务（needs：等上面三个全部成功才执行）
  # ============================================================
  deploy:
    name: Deploy to K8s
    needs: [ build-api, build-consumer, build-frontend ]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 更新 K8s 里的镜像 tag（用 SHA 精确版本）
      - name: Update image tags
        shell: powershell
        run: |
          $tag = "${{ github.sha }}"
          kubectl set image deployment/taskapi taskapi=${{ secrets.DOCKER_USERNAME }}/taskapi:$tag
          kubectl set image deployment/consumer consumer=${{ secrets.DOCKER_USERNAME }}/rabbitmqconsumer:$tag
          kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend:$tag

      # 👇 等待滚动更新完成
      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/taskapi --timeout=120s
          kubectl rollout status deployment/consumer --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s

      # 👇 验证 Pod 状态
      - name: Verify pods
        shell: powershell
        run: |
          kubectl get pods
          Write-Host "Deployment successful."