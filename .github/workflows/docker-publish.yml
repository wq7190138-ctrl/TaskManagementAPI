name: CD - Build and Push Docker Images

on:
  push:
    branches: [ main ]

# ① env：全局环境变量
env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # ② 构建并推送 API 镜像
  # ============================================================
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ③ 登录 Docker Hub（使用 secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ④ 构建并推送镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagementAPI
          file: ./TaskManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/taskapi:latest
            ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}

  # ============================================================
  # 构建并推送 Consumer 镜像
  # ============================================================
  build-consumer:
    name: Build & Push Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./RabbitMQConsumer
          file: ./RabbitMQConsumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:latest
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}

  # ============================================================
  # 构建并推送 Frontend 镜像
  # ============================================================
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ============================================================
  # ⑤ 部署任务（needs：等上面三个全部成功才执行）
  # ============================================================
  deploy:
    name: Deploy to K8s
    needs: [ build-api, build-consumer, build-frontend ]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 用 sed 把占位符替换成当前 commit SHA
      - name: Replace image tags in manifests
        shell: powershell
        run: |
          $tag = "${{ github.sha }}"
          $user = "${{ secrets.DOCKER_USERNAME }}"
          
          # 替换 taskapi.yaml
          (Get-Content k8s/taskapi.yaml) `
            -replace "wq652/taskapi:IMAGE_TAG", "$user/taskapi:$tag" `
            | Set-Content k8s/taskapi.yaml
          
          # 替换 consumer.yaml
          (Get-Content k8s/consumer.yaml) `
            -replace "wq652/rabbitmqconsumer:IMAGE_TAG", "$user/rabbitmqconsumer:$tag" `
            | Set-Content k8s/consumer.yaml
          
          # 替换 frontend.yaml
          (Get-Content k8s/frontend.yaml) `
            -replace "wq652/frontend:IMAGE_TAG", "$user/frontend:$tag" `
            | Set-Content k8s/frontend.yaml

      # 👇 应用到 K8s（对比差异，自动滚动更新）
      - name: Apply manifests
        shell: powershell
        run: |
          kubectl apply -f k8s/taskapi.yaml
          kubectl apply -f k8s/consumer.yaml
          kubectl apply -f k8s/frontend.yaml

      # 👇 等待滚动更新完成
      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/taskapi --timeout=120s
          kubectl rollout status deployment/consumer --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s

      # 👇 验证结果
      - name: Verify
        shell: powershell
        run: |
          kubectl get pods
          Write-Host "Deployment completed successfully."