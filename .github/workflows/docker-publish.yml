name: CD - Build and Push Docker Images

on:
  push:
    branches: [ main ]

# ① env：全局环境变量
env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # ② 构建并推送 API 镜像
  # ============================================================
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ③ 登录 Docker Hub（使用 secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ④ 构建并推送镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagementAPI
          file: ./TaskManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/taskapi:latest
            ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}

  # ============================================================
  # 构建并推送 Consumer 镜像
  # ============================================================
  build-consumer:
    name: Build & Push Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./RabbitMQConsumer
          file: ./RabbitMQConsumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:latest
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}

  # # ============================================================
  # # 构建并推送 Frontend 镜像
  # # ============================================================
  # build-frontend:
  #   name: Build & Push Frontend
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Login to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKER_USERNAME }}
  #         password: ${{ secrets.DOCKER_PASSWORD }}

  #     - name: Build and push Frontend image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: ./frontend
  #         file: ./frontend/Dockerfile
  #         push: true
  #         tags: |
  #           ${{ env.IMAGE_PREFIX }}/frontend:latest
  #           ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ============================================================
  # ⑤ 部署任务（needs：等上面三个全部成功才执行）
  # ============================================================
  deploy:
    name: Deploy to Server
    needs: [ build-api, build-consumer ]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        shell: powershell
        run: |
          $env_content = "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}`n"
          $env_content += "TAG=${{ github.sha }}`n"
          $env_content += "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}`n"
          $env_content += "POSTGRES_USER=${{ secrets.POSTGRES_USER }}`n"
          $env_content += "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}`n"
          $env_content += "POSTGRES_DB=${{ secrets.POSTGRES_DB }}`n"
          $env_content += "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}`n"
          $env_content += "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}`n"
          $env_content += "ASPNETCORE_ENVIRONMENT=${{ secrets.ASPNETCORE_ENVIRONMENT }}`n"
          $env_content += "VITE_API_URL=${{ secrets.VITE_API_URL }}`n"
          [System.IO.File]::WriteAllText("$PWD\.env", $env_content)

      # 👇 带重试的拉取（用 SHA 标签）
      - name: Pull latest images
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $maxRetries = 3
          $images = @(
            "${{ secrets.DOCKER_USERNAME }}/taskapi:${{ github.sha }}",
            "${{ secrets.DOCKER_USERNAME }}/rabbitmqconsumer:${{ github.sha }}"
          )
          foreach ($img in $images) {
            $success = $false
            for ($i = 1; $i -le $maxRetries; $i++) {
              Write-Host "Attempt $i to pull $img"
              docker pull $img
              if ($LASTEXITCODE -eq 0) { $success = $true; break }
              Write-Host "Pull failed, retrying in 5 seconds..."
              Start-Sleep -Seconds 5
            }
            if (-not $success) { throw "Failed to pull $img after $maxRetries attempts" }
          }

      - name: Deploy with docker-compose
        shell: powershell
        run: |
          docker compose up -d

          # 等待 15 秒让容器启动
          Start-Sleep -Seconds 15

          # 检查 API 健康状态
          $health = docker inspect --format='{{.State.Health.Status}}' my-taskapi-compose-1 2>$null
          if ($health -ne "healthy") {
            Write-Host "API 健康检查状态: $health"
            docker logs my-taskapi-compose-1 --tail 50
            throw "API 健康检查失败"
          }
          Write-Host "✅ 部署成功，API 健康检查通过"  