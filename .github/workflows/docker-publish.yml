name: CD - Build and Push Docker Images

on:
  push:
    branches: [ main ]

# ① env：全局环境变量
env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # ② 构建并推送 API 镜像
  # ============================================================
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ③ 登录 Docker Hub（使用 secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ④ 构建并推送镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagementAPI
          file: ./TaskManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/taskapi:latest
            ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}

  # ============================================================
  # 构建并推送 Consumer 镜像
  # ============================================================
  build-consumer:
    name: Build & Push Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./RabbitMQConsumer
          file: ./RabbitMQConsumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:latest
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}

  # # ============================================================
  # # 构建并推送 Frontend 镜像
  # # ============================================================
  # build-frontend:
  #   name: Build & Push Frontend
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Login to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKER_USERNAME }}
  #         password: ${{ secrets.DOCKER_PASSWORD }}

  #     - name: Build and push Frontend image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: ./frontend
  #         file: ./frontend/Dockerfile
  #         push: true
  #         tags: |
  #           ${{ env.IMAGE_PREFIX }}/frontend:latest
  #           ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ============================================================
  # ⑤ 部署任务（needs：等上面三个全部成功才执行）
  # ============================================================
  deploy:
    name: Deploy to Server
    needs: [ build-api, build-consumer ]  # 👈 依赖
    runs-on: ubuntu-latest
    # ⑥ if：只在 main 分支执行
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 暂时只是打印，等你准备好了再换成真实 SSH 部署
      - name: Show deployment info
        run: |
          echo "🚀 准备部署"
          echo "API 镜像: ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}"
          echo "Consumer 镜像: ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}"
          echo "Frontend 镜像: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}"
          echo "提交者: ${{ github.actor }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"