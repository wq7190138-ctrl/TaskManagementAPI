name: CD - Build and Push Docker Images

on:
  push:
    branches: [ main ]

# ① env：全局环境变量
env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # ② 构建并推送 API 镜像
  # ============================================================
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ③ 登录 Docker Hub（使用 secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ④ 构建并推送镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./TaskManagementAPI
          file: ./TaskManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/taskapi:latest
            ${{ env.IMAGE_PREFIX }}/taskapi:${{ github.sha }}

  # ============================================================
  # 构建并推送 Consumer 镜像
  # ============================================================
  build-consumer:
    name: Build & Push Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./RabbitMQConsumer
          file: ./RabbitMQConsumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:latest
            ${{ env.IMAGE_PREFIX }}/rabbitmqconsumer:${{ github.sha }}

  # ============================================================
  # 构建并推送 Frontend 镜像
  # ============================================================
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ============================================================
  # ⑤ 部署任务（needs：等上面三个全部成功才执行）
  # ============================================================
  deploy:
    name: Deploy to K3s
    needs: [ build-api, build-consumer, build-frontend ]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH to Ubuntu K3s
        shell: powershell
        run: |
          # 1. 生成一个唯一的临时文件路径（避免旧文件权限问题）
          $keyPath = Join-Path $env:TEMP "ubuntu_key_$([System.Guid]::NewGuid().ToString('N'))"
          
          # 2. 从 Base64 解码私钥
          $keyB64 = "${{ secrets.UBUNTU_SSH_KEY }}"
          $keyBytes = [System.Convert]::FromBase64String($keyB64)
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          
          # 3. 设置私钥权限
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          
          # 4. SSH 执行远程命令
          $remoteCmd = "kubectl set image deployment/taskapi taskapi=wq652/taskapi:${{ github.sha }} && kubectl set image deployment/consumer consumer=wq652/rabbitmqconsumer:${{ github.sha }} && kubectl set image deployment/frontend frontend=wq652/frontend:${{ github.sha }} && kubectl rollout status deployment/taskapi --timeout=120s && kubectl rollout status deployment/consumer --timeout=120s && kubectl rollout status deployment/frontend --timeout=120s && kubectl get pods"
          
          ssh -i $keyPath -o StrictHostKeyChecking=no wq@${{ secrets.UBUNTU_HOST }} $remoteCmd
          
          # 5. 清理
          Remove-Item $keyPath -Force -ErrorAction SilentlyContinue