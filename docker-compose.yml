  #     - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  #   depends_on:
  #     - rabbitmq1
  #     - rabbitmq2
  #     - rabbitmq3

  rabbitmqconsumer:
    image: ${DOCKER_USERNAME}/rabbitmqconsumer:${TAG:-latest}
    # build:
    #   context: ./RabbitMQConsumer
    #   dockerfile: Dockerfile
    container_name: my-consumer
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=123456
    depends_on:
      - rabbitmq
    networks:
      - my-dev-network

networks:
  my-dev-network:
    driver: bridge

