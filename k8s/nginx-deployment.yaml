# ============================================================
# Deployment：管理 Pod 的副本数、镜像、环境变量
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app: nginx-test
spec:
  replicas: 1              # 副本数
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

---
# ============================================================
# Service：给 Pod 提供稳定的访问入口
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-test-svc
spec:
  type: NodePort              # 暴露到宿主机端口
  selector:
    app: nginx-test           # 👈 必须与 Deployment 的 labels 匹配
  ports:
    - port: 80                # Service 的端口
      targetPort: 80          # Pod 的端口
      nodePort: 30080         # 宿主机访问端口（范围 30000-32767）