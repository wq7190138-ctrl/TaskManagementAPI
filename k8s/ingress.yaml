apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanagement-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          # API 路由（优先级更高）
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskapi-svc
                port:
                  number: 8080
          # 前端路由（兜底）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80