# ============================================================
# ConfigMap：非敏感配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: consumer-config
data:
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Port: "5672"

---
# ============================================================
# Secret：敏感信息
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: consumer-secret
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mydb;Username=admin;Password=123456"
  Redis__ConnectionString: "redis:6379,password=,defaultDatabase=0"
  RabbitMQ__UserName: "admin"
  RabbitMQ__Password: "123456"

---
# ============================================================
# Deployment：Consumer
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    app: consumer
spec:
  replicas: 1                    # 👈 Consumer 只起 1 个副本
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: wq652/rabbitmqconsumer:IMAGE_TAG
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: consumer-config
            - secretRef:
                name: consumer-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"